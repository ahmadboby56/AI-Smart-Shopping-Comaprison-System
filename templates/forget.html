{% extends "base.html" %}

{% block title %}Forget Password - Smart Shopping{% endblock %}

{% block extra_css %}
<style>
  .auth-section {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 4rem 1rem;
  }

  .auth-card {
    background: var(--bg-card);
    padding: 3rem;
    border-radius: 2rem;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 450px;
  }

  .auth-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .auth-header h2 {
    font-size: 2rem;
    font-weight: 800;
    color: var(--text-main);
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 0.5rem;
  }

  .form-group input {
    width: 100%;
    padding: 0.875rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--bg-body);
    color: var(--text-main);
    outline: none;
    transition: var(--transition);
  }

  .form-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  }

  .auth-links {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .auth-links a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 700;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Reset Access</h2>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Enter your email to receive a recovery link.</p>
    </div>

    <form class="auth-form" action="{{ url_for('forget') }}" method="POST">
      <div class="form-group">
        <label>Recovery Email</label>
        <input type="email" name="email" required placeholder="name@example.com">
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 1rem; border-radius: 0.75rem;">
        Send Recovery Email
      </button>

      <div class="auth-links">
        Remember your password? <a href="{{ url_for('signin') }}">Sign In</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
