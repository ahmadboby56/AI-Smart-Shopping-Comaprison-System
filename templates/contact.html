{% extends "base.html" %}

{% block title %}Contact - Smart Shopping FYP{% endblock %}

{% block extra_css %}
<style>
    .contact-section {
        padding: 4rem 1rem;
        max-width: 1200px;
        margin: 0 auto;
    }

    .contact-container {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 5rem;
        align-items: start;
    }

    @media (max-width: 992px) {
        .contact-container {
            grid-template-columns: 1fr;
            gap: 3rem;
        }
    }

    .contact-info h1 {
        font-size: 3.5rem;
        font-weight: 800;
        margin-bottom: 1.5rem;
        color: var(--text-main);
    }

    .contact-info p {
        font-size: 1.125rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 3rem;
    }

    .info-item {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 2rem;
        padding: 1.5rem;
        background: var(--bg-card);
        border-radius: 1.25rem;
        border: 1px solid var(--border);
        transition: var(--transition);
    }

    .info-item:hover {
        transform: translateX(10px);
        border-color: var(--primary);
    }

    .info-item i {
        width: 3.5rem;
        height: 3.5rem;
        background: rgba(99, 102, 241, 0.1);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        font-size: 1.5rem;
    }

    .info-text h3 {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.25rem;
    }

    .info-text p {
        font-size: 1rem;
        color: var(--text-main);
        margin-bottom: 0;
        font-weight: 700;
    }

    .contact-card {
        background: var(--bg-card);
        padding: 3.5rem;
        border-radius: 2rem;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
    }

    .contact-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .form-group label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 0.5rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 0.875rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--bg-body);
        color: var(--text-main);
        outline: none;
        transition: var(--transition);
        font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .btn-submit {
        width: 100%;
        padding: 1rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1rem;
    }

    .btn-submit:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="contact-section">
    <div class="contact-container">
        <div class="contact-info">
            <h1>Let's Connect</h1>
            <p>Have questions, feedback, or inquiries? Get in touch with our team, and we will get back to you as soon
                as possible.</p>


        </div>

        <div class="contact-card">
            <form class="contact-form" action="{{ url_for('submit_contact') }}" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label>Inquiry Category</label>
                    <select name="category">
                        <option>Technical Question</option>
                        <option>Business Inquiry</option>
                        <option>Bug Report</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Your Message</label>
                    <textarea name="message" rows="4" placeholder="How can I help you today?" required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    Send Message <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
