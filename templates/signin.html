{% extends "base.html" %}

{% block title %}Sign In - Smart Shopping{% endblock %}

{% block extra_css %}
<style>
  .auth-section {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 4rem 1rem;
  }

  .auth-card {
    background: var(--bg-card);
    padding: 3rem;
    border-radius: 2rem;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 450px;
  }

  .auth-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .auth-header h2 {
    font-size: 2rem;
    font-weight: 800;
    color: var(--text-main);
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 0.5rem;
  }

  .form-group input {
    width: 100%;
    padding: 0.875rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--bg-body);
    color: var(--text-main);
    outline: none;
    transition: var(--transition);
  }

  .form-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  }

  .auth-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.875rem;
    color: var(--text-muted);
  }

  .auth-footer a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
  }

  .auth-footer a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Sign in to continue to Smart Shopping</p>
    </div>

    <form action="{{ url_for('signin') }}" method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <label style="margin-bottom: 0;">Password</label>
          <a href="{{ url_for('forget') }}"
            style="font-size: 0.75rem; color: var(--primary); text-decoration: none; font-weight: 600;">Forgot
            password?</a>
        </div>
        <input type="password" name="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-primary"
        style="width: 100%; padding: 1rem; border-radius: 0.75rem; margin-top: 1rem;">
        Sign In
      </button>

      <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('signup') }}">Create one now</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
